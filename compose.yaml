name: cnpm-524

x-node: &node
  image: cnpm-524-dev
  build: .
  init: true
  working_dir: /app
  environment: &app-env
    NODE_ENV: development
    NEXT_TELEMETRY_DISABLED: "1"
    DB_HOST: db
    DB_PORT: "3306"
    DB_NAME: ${DB_NAME:-cnpm_524_docker}
    DB_USER: ${DB_USER:-cnpm_524_app}
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}
    APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
    DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_SETUP_PASSWORD:?Set DB_SETUP_PASSWORD in .env.docker}
      MARIADB_ROOT_HOST: "%"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  db-setup:
    <<: *node
    command: ["npm", "run", "db:setup"]
    environment:
      <<: *app-env
      DB_SETUP_USER: root
      DB_SETUP_PASSWORD: ${DB_SETUP_PASSWORD:?Set DB_SETUP_PASSWORD in .env.docker}
      DB_USER_HOST: "%"
      MYSQLDUMP_PATH: /usr/bin/mariadb-dump
      MYSQL_CLIENT_PATH: /usr/bin/mariadb
    volumes:
      - ./backups/docker:/app/backups
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *node
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      db-setup:
        condition: service_completed_successfully
    develop:
      watch:
        - action: sync
          path: ./app
          target: /app/app
          initial_sync: true
        - action: sync
          path: ./public
          target: /app/public
          initial_sync: true
        - action: sync+restart
          path: ./database
          target: /app/database
          initial_sync: true
        - action: sync+restart
          path: ./next.config.ts
          target: /app/next.config.ts
        - action: sync+restart
          path: ./tsconfig.json
          target: /app/tsconfig.json
        - action: sync+restart
          path: ./postcss.config.mjs
          target: /app/postcss.config.mjs
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json

  worker:
    <<: *node
    command: ["node", "scripts/push-worker.mjs"]
    stop_grace_period: 40s
    depends_on:
      db-setup:
        condition: service_completed_successfully
    develop:
      watch:
        - action: sync+restart
          path: ./scripts
          target: /app/scripts
          initial_sync: true
        - action: sync+restart
          path: ./app/lib
          target: /app/app/lib
          initial_sync: true
        - action: sync+restart
          path: ./database
          target: /app/database
          initial_sync: true
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json

volumes:
  db-data:
